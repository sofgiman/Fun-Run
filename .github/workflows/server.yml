name: Server Build


on:
  workflow_dispatch:  # Enables manual trigger

  push:
    tags:
     - '*'
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  linux_build: 
    uses: ./.github/workflows/build-server-template.yml
    with:
      os: "ubuntu"
      targetPlatform: "StandaloneLinux64"
    secrets: inherit
    

  
  windows_build:
    uses: ./.github/workflows/build-server-template.yml
    with:
      os: "windows"
      targetPlatform: "StandaloneWindows64"
    secrets: inherit

  dockerize:
    needs: linux_build
    runs-on: ubuntu-latest
    outputs:
      IMAGE_NAME_LOWER: ${{ steps.vars.outputs.IMAGE_NAME_LOWER }}
      TAG_NAME: ${{ steps.vars.outputs.TAG_NAME }}

    steps:
      - uses: actions/checkout@v4
      # Download Linux artifact (only for Linux build)
      - name: Download Linux build artifact
        if: ${{ needs.linux_build.outputs.targetPlatform == 'StandaloneLinux64' }}
        uses: actions/download-artifact@v4
        with:
          name: Fun Run Server ${{ needs.linux_build.outputs.os }}
          path: ./build/StandaloneLinux64

      # Compute variables once
      - name: Compute variables
        id: vars
        run: |
          # Lowercase repository name
          echo "IMAGE_NAME_LOWER=$(echo '${GITHUB_REPOSITORY}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

          # Determine tag
          TAG=$(basename "$GITHUB_REF_NAME")
          echo "TAG_NAME=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          

      # Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/${{ steps.vars.outputs.IMAGE_NAME_LOWER }}/fun-run-server:${{ steps.vars.outputs.TAG_NAME }} \
            -f docker/Linux/Dockerfile .

  push:
    runs-on: ubuntu-latest
    needs: dockerize
    # Deploy to dev or prod when:
    # Prod: A tag push trigger, means a new release
    # Dev: A push to dev branch after a pull request merge
    outputs:
      IMAGE_NAME_LOWER: ${{ needs.dockerize.outputs.IMAGE_NAME_LOWER }}
      TAG_NAME: ${{ needs.dockerize.outputs.TAG_NAME }}
    if: |
      github.event_name == 'push' && (
        (github.ref_type == 'branch' && github.ref_name == 'dev') ||
        (github.ref_type == 'tag')
      )
    steps:
      # Login to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push docker image
      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ needs.dockerize.outputs.IMAGE_NAME_LOWER }}/fun-run-server:${{ needs.dockerize.outputs.TAG_NAME }}

  deploy:
    needs: push
    uses: ./.github/workflows/deploy-ecs-app-template.yml
    with:
      image_uri: ghcr.io/${{ needs.push.outputs.IMAGE_NAME_LOWER }}/fun-run-server:${{ needs.push.outputs.TAG_NAME }}
    secrets: inherit


