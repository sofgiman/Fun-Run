name: "[Prod] Deploy Data Layer"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (Terraform Plan only)'
        required: true
        type: boolean
        default: false

jobs:
  safety_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Branch
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "ERROR: This workflow can only be run from the 'main' branch."
            exit 1
          fi
          echo "Branch verification passed."

  deploy_data:
    needs: safety_checks
    uses: ./.github/workflows/template-deploy-data.yml
    with:
      isApply: ${{ !inputs.dry_run }}
      isDestroy: false
      stage: "prod"
      terraformDir: "terraform/live/data"
    secrets: 
      role_arn: ${{ secrets.AWS_ROLE_PROD }}
      role_plan_arn: ${{ secrets.AWS_ROLE_PLAN }}