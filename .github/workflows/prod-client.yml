name: "[Prod] Client"

on:
  workflow_dispatch:
  push:
    tags:
     - 'v*'
  pull_request:
    branches:
      - main

jobs:
  verify_branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure tag is from main
        if: github.event_name != 'pull_request'
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "${{ github.ref_name }}")
          if git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Tag ${{ github.ref_name }} is from main. Proceeding."
          else
            echo "ERROR: Tag ${{ github.ref_name }} was not created from main!"
            exit 1
          fi

  mac_build:
    needs: verify_branch
    uses: ./.github/workflows/template-build-client.yml
    with:
      os: "Mac"
      targetPlatform: "StandaloneOSX"
      buildName: "Fun Run"
      serverAddress: "fun-run.idanyafe.com"
    secrets: inherit

  linux_build: 
    needs: verify_branch
    uses: ./.github/workflows/template-build-client.yml
    with:
      os: "Linux"
      targetPlatform: "StandaloneLinux64"
      buildName: "Fun Run"
      serverAddress: "fun-run.idanyafe.com"
    secrets: inherit

  windows_build:
    needs: verify_branch
    uses: ./.github/workflows/template-build-client.yml
    with:
      os: "Windows"
      targetPlatform: "StandaloneWindows64"
      buildName: "Fun Run"
      serverAddress: "fun-run.idanyafe.com"
    secrets: inherit

  publish_release:
    needs: [mac_build, linux_build, windows_build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Artifacts
        run: |
          mkdir -p final_assets

          # Mac handling: Preserve executable permissions and symlinks
          cd "artifacts/Fun-Run-Mac"
          # Use 'find' to grant executable permissions to all contents within the .app bundle.
          # This ensures both the main executable and internal frameworks (.dylib) can run.
          find . -name "*.app" -type d -exec chmod -R +x {} \;
          
          # Note on 'zip -ry':
          # '-r' is for recursive archiving.
          # '-y' is crucial for macOS; it preserves symbolic links (symlinks) instead of 
          # replacing them with the files they point to. Without '-y', the internal structure 
          # of the Mac App bundle gets corrupted, resulting in an "App is damaged" error.
          zip -ry "../../final_assets/Fun-Run-Mac.zip" .
          cd ../..

          # Linux handling: Set executable permissions
          cd "artifacts/Fun-Run-Linux"
          chmod +x ./*.x86_64
          # Ensure internal shared objects (.so) also have executable permissions
          find . -name "*.so" -type f -exec chmod +x {} \;
          zip -r "../../final_assets/Fun-Run-Linux.zip" .
          cd ../..

          # Windows handling: Standard zip, no special POSIX permissions required
          cd "artifacts/Fun-Run-Windows"
          zip -r "../../final_assets/Fun-Run-Windows.zip" .
          cd ../..

      - uses: softprops/action-gh-release@v1
        with:
          files: "final_assets/*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}