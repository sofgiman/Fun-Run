# Prod Environment Destroy
#
# Destroys the Prod ECS server and underlying infrastructure.
# Runs strictly from the 'main' branch for AWS OIDC compliance.
# Actual destruction is restricted to 'sofgiman'; 'Dry Run' is available for all.

name: "[Prod] Destroy Environment"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (Terraform Plan only - Safe)'
        required: true
        type: boolean
        default: true
      confirm_action:
        description: 'Are you SURE you want to destroy the PROD environment? (Ignored if Dry Run)'
        required: false
        type: boolean
        default: false
      verification_code:
        description: 'Type "DESTROY" to confirm (Ignored if Dry Run)'
        required: false
        type: string

jobs:
  safety_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Branch
        run: |
          # Ensure the workflow is only triggered from the main branch
          # This prevents AWS STS AssumeRole failures due to OIDC trust policy
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "ERROR: This workflow can only be run from the 'main' branch."
            echo "Current branch: ${{ github.ref }}"
            exit 1
          fi
          echo "Branch verification passed."

      - name: Verify Authorized User (Only for Apply)
        if: ${{ inputs.dry_run == false }}
        run: |
          # Ensure only 'sofgiman' can actually destroy the Prod environment
          if [[ "${{ github.actor }}" != "sofgiman" ]]; then
            echo "ERROR: Unauthorized action. Only 'sofgiman' is allowed to destroy PROD."
            echo "Attempted by: ${{ github.actor }}"
            exit 1
          fi
          echo "User authorization passed."

      - name: Verify Confirmation (Only for Apply)
        if: ${{ inputs.dry_run == false }}
        run: |
          # Validate user confirmation inputs before proceeding with destruction
          if [[ "${{ inputs.confirm_action }}" != "true" ]]; then
            echo "ERROR: You must check the confirmation box to apply destroy."
            exit 1
          fi
          
          if [[ "${{ inputs.verification_code }}" != "DESTROY" ]]; then
             echo "ERROR: You must type 'DESTROY' in the verification field."
             exit 1
          fi
          echo "User confirmation for actual destruction passed."

  destroy_server:
    name: Destroy ECS Server
    needs: safety_checks
    uses: ./.github/workflows/template-deploy-server.yml
    with:
      image_uri: "ignore"
      git_commit_hash: "ignore"
      # If dry_run is true, isApply becomes false (uses plan role)
      isApply: ${{ !inputs.dry_run }} 
      isDestroy: true  
      stage: "prod"
      terraformDir: "terraform/server/deploy"
    secrets: 
      role_arn: ${{ secrets.AWS_ROLE_PROD }}
      role_plan_arn: ${{ secrets.AWS_ROLE_PLAN }}

  destroy_infra:
    name: Destroy Infrastructure
    needs: destroy_server 
    uses: ./.github/workflows/template-deploy-infrastructure.yml 
    with:
      # If dry_run is true, isApply becomes false (uses plan role)
      isApply: ${{ !inputs.dry_run }} 
      isDestroy: true
      stage: "prod"
      terraformDir: "terraform/infrastructure/deploy"
    secrets: 
      role_arn: ${{ secrets.AWS_ROLE_PROD }}
      role_plan_arn: ${{ secrets.AWS_ROLE_PLAN }}